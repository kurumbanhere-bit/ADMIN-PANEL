<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Management - KL ESPORTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="host.css">
</head>
<body>

<div class="header">
    <i class="fa-solid fa-arrow-left back-btn" onclick="goBack()"></i>
    <h1>Host Management</h1>
</div>

<div class="container">
    <!-- Host Approval Card -->
    <div class="admin-card" onclick="goTo('host-approval.html')">
        <div class="info">
            <i class="fa-solid fa-user-check"></i>
            <h3>Host Approval</h3>
        </div>
        <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </div>

    <!-- Host Match Sender Card -->
    <div class="admin-card alt" onclick="goTo('host-match-sender.html')">
        <div class="info">
            <i class="fa-solid fa-paper-plane"></i>
            <h3>Host Match Sender</h3>
        </div>
        <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </div>
</div>

<script src="host.js"></script>
</body>
</html>
