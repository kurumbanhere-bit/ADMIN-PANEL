<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalize Results - KL ESPORTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="winnings-sender-card.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header-nav">
        <div class="nav-left">
            <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
            <span id="matchTitle" class="nav-title">LOADING...</span>
        </div>
        <span id="mStatus" class="badge-status">Ended</span>
    </div>

    <div class="stats-bar">
        <div class="stat-item">🏆 <span id="mPrize">0</span></div>
        <div class="stat-item">👥 <span id="mJoined">0</span> / <span id="mMax">0</span></div>
    </div>

    <div class="host-result-preview">
        <span class="preview-label">Review Screenshots</span>
        <div class="img-grid" id="imageGallery"></div>
        <p id="noImgText" class="empty-text" style="display:none;">No screenshots found</p>
    </div>

    <div class="sheet">
        <div class="header-row">
            <div>Player</div>
            <div>Rank</div>
            <div>Kills</div>
            <div>Prize</div>
        </div>
        <div id="participantsList" class="loading">Loading Players...</div>
    </div>

    <div id="winnerListDisplay" class="winner-list-table-container">
        </div>

    <div class="footer-action">
        <button id="updateBtn" onclick="saveResults()" style="padding: 12px 25px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 90%;">
            Update Match Win
        </button>
    </div>

    <script src="winnings-sender-card.js"></script>
</body>
</html>
