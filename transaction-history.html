<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transactions - KL ESPORTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #2ecc71; --bg: #f4f7f6; --white: #ffffff;
            --text-main: #2c3e50; --text-dim: #7f8c8d;
            --success: #27ae60; --pending: #f39c12; --failed: #e74c3c;
        }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { padding: 15px; display: flex; align-items: center; background: var(--primary); color: white; position: sticky; top: 0; z-index: 100; }
        .header i { font-size: 20px; margin-right: 15px; cursor: pointer; }
        .container { padding: 15px; }
        .tx-card {
            background: var(--white); border-radius: 10px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #ccc;
        }
        .tx-card.success { border-left-color: var(--success); }
        .tx-card.pending { border-left-color: var(--pending); }
        .tx-card.failed { border-left-color: var(--failed); }
        .tx-type { font-weight: bold; font-size: 15px; text-transform: uppercase; }
        .tx-date { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        .tx-amount { font-size: 17px; font-weight: bold; }
        .status-badge { font-size: 9px; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: inline-block; }
        .badge-success { background: #e8f8f0; color: var(--success); }
        .badge-pending { background: #fef5e7; color: var(--pending); }
        .badge-failed { background: #fdedec; color: var(--failed); }
        #loader { text-align: center; margin-top: 50px; color: #999; }
    </style>
</head>
<body>

<div class="header">
    <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
    <span>TRANSACTION HISTORY</span>
</div>

<div class="container" id="txContainer">
    <div id="loader">Checking records...</div>
</div>

<script type="module" src="transaction-history.js"></script>
</body>
</html>
