<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | KL ESPORTS</title>
    
    <script>
        const session = localStorage.getItem("adminSession");
        if (session) {
            const userData = JSON.parse(session);
            if (userData.email === "kurumbanhere@gmail.com") {
                window.location.replace("dashboard.html");
            }
        }
    </script>

    <style>
        body { visibility: hidden; opacity: 0; transition: opacity 0.3s ease; }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="login-card">
    <div class="logo-circle">
        <i class="fa-solid fa-user-shield"></i>
    </div>
    <h2>ADMIN LOGIN</h2>
    <p class="subtitle">KERALA ESPORTS OFFICIAL</p>

    <div class="input-group">
        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Gmail Address">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="pass" placeholder="Password">
        </div>
    </div>

    <button class="btn-login" onclick="checkLogin()">LOGIN</button>
    <div id="msg"></div>
</div>

<footer class="login-footer">
    © 2026 KERALA ESPORTS. Developed by JOSH.M.LYJU
</footer>

<script src="index.js"></script>
</body>
</html>
